<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#E30613" />
  <title>Midea Factory PMS</title>
  <link rel="stylesheet" href="css/styles.css" />
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- ZXing (barcodes) and Tesseract (OCR) are loaded on demand by js/scanner.js, with a fallback CDN,
       so a blocked CDN no longer breaks page load and the native BarcodeDetector needs no download. -->
</head>
<body>
  <div id="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div class="brand-text">
          <strong>MIDEA</strong>
          <small>Factory PMS</small>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-footer">
        <button id="logout-btn" class="btn-outline btn-block">Sign out</button>
      </div>
    </aside>
    <div id="main">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn" aria-label="Menu">☰</button>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-user">
          <span id="user-role" class="role-badge">—</span>
          <span id="user-name">—</span>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>
  <div id="toast-container" class="toast-container"></div>
  <div id="modal-root"></div>
  <div id="loading-overlay" class="loading-overlay hidden"><div class="spinner"></div></div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  
  <!-- Modules -->
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/welding.js"></script>
  <script src="js/modules/production.js"></script>
  <script src="js/modules/inventory.js"></script>
  <script src="js/modules/quality.js"></script>
  <script src="js/modules/reports.js"></script>
  <script src="js/modules/users.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/modules/logs.js"></script>
  
  <script src="js/app.js"></script>
</body>
</html>
